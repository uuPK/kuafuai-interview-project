# Host-installed HTTPS proxy: set NEWS_TRUSTED_PROXY_IP to this Docker network's
# gateway address. Do not use '*'. The API port remains bound to host loopback.
services:
  api:
    command:
      - python
      - -m
      - uvicorn
      - app.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${NEWS_TRUSTED_PROXY_IP:?Set the exact trusted Docker gateway IP}
