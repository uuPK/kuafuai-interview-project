[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-ai-news-assistant"
version = "0.1.0"
description = "A preference-driven daily AI news research assistant."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "httpcore[asyncio]>=1.0.9,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "trafilatura>=2.3,<3",
    "lxml>=6,<7",
    "uvicorn>=0.34,<1",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2.2,<3",
    "tzdata>=2025.2,<2027",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest_cache/tmp"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
